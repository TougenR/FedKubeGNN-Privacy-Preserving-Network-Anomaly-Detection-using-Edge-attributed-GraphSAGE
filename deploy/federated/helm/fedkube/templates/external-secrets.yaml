{{- if .Values.externalSecrets.enabled }}
{{- if eq .Values.mode "central" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.flower.tlsSecretName }}
  labels:
    {{- include "fedkube.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ .Values.flower.tlsSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: {{ .Values.externalSecrets.flowerCaSecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: tls.crt
      remoteRef:
        key: {{ .Values.externalSecrets.flowerCertSecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: tls.key
      remoteRef:
        key: {{ .Values.externalSecrets.flowerKeySecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.flower.caSecretName }}
  labels:
    {{- include "fedkube.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ .Values.flower.caSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: {{ .Values.externalSecrets.flowerCaSecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.elastic.credentialsSecretName }}
  labels:
    {{- include "fedkube.labels" . | nindent 4 }}
  annotations:
    force-sync: {{ .Values.releaseId | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ .Values.elastic.credentialsSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: filebeat_writer
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.elasticPasswordSecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
