  name: fedper-detection
  version: 9.2.3
  kibanaCount: 1
  kibanaNodeOptions: --max-old-space-size=512
  bootstrapRevision: v5-fusion
  storageClassName: standard-rwo
  storageSize: 10Gi
  elasticsearchResources:
    requests: {cpu: 10m, memory: 2Gi}
    limits: {cpu: "1", memory: 2Gi}
  kibanaResources:
    requests: {cpu: 25m, memory: 768Mi}
    limits: {cpu: 500m, memory: 1Gi}
externalSecrets:
  enabled: true
