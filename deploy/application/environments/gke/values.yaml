deploymentStrategy: RollingUpdate
deploymentMaxSurge: 0
deploymentMaxUnavailable: 1
modelBundle:
  existingClaim: ""
  existingSecret: fedper-model-bundle-serving-8d59392ff1
inference:
  enabled: true
  resources:
    requests: {cpu: 10m, memory: 768Mi}
    limits: {cpu: "2", memory: 2Gi}
demoTarget:
  enabled: true
  observation:
    enabled: false
    sensorId: sensor-34-1
  resources:
    requests: {cpu: 1m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
zeek:
  # VM-local Zeek now preserves the original generator-side topology. Keeping
  # the former target-side capture enabled would duplicate every live flow.
  enabled: false
  captureFilter: ""
  sensorId: sensor-34-1
  resources:
    requests: {cpu: 5m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  shipperResources:
    requests: {cpu: 1m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
demoConsole:
  enabled: true
  monitorBufferSize: 500
  resources:
    requests: {cpu: 1m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
trafficGenerator:
  enabled: true
  agentUrl: http://10.10.0.20:8091
  sensorId: sensor-34-1
  agentTokenSecretName: fedkube-detection-traffic-agent-token
  observationTokenSecretName: fedkube-detection-traffic-observation-token
  # Two-revision GitOps gate: Jenkins first publishes an image containing the
  # emulator, then the environment-only activation commit flips this to true.
  emulator:
    enabled: false
gateway:
  enabled: true
  observationPort:
    enabled: true
    port: 8082
  resources:
    requests: {cpu: 1m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
collector:
  enabled: true
  monitorBufferSize: 500
  window:
    durationSeconds: 60
    maxFlows: 50
    emitStrideFlows: 1
    allowedLatenessSeconds: 1
  alertPolicy:
    enabled: true
    decisionSource: trusted-shadow
    confidenceThreshold: 0.85
    confidenceBoundaries: [0.0, 0.5, 0.7, 0.85, 0.95, 1.0]
    entropyBoundaries: [0.0, 0.25, 0.5, 1.0, 2.0]
    classSeverity:
      Attack: low
      C&C: high
      C&C-HeartBeat: medium
      DDoS: high
      Okiru: high
      PartOfAHorizontalPortScan: medium
    entityHashSecretName: fedkube-detection-detection-stack-entity-hash
  resources:
    requests: {cpu: 5m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
alertRouter:
  enabled: true
  resources:
    requests: {cpu: 1m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
evaluation:
  enabled: false
  artifactsClaim:
    retain: true
ingress:
  enabled: false
elasticsearch:
  enabled: true
  endpoint: https://fedper-detection-es-http:9200
  index: fedper-detections
  username: elastic
  credentialsSecretName: fedper-detection-es-elastic-user
  credentialsSecretKey: elastic
  caSecretName: fedper-detection-es-http-certs-public
