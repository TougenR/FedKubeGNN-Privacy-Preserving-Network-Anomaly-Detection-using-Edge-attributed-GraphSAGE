image:
  repository: fedkube-detection
  tag: phase4-local
  digest: ""
  pullPolicy: IfNotPresent

releaseId: phase4-unreleased
deploymentStrategy: RollingUpdate
deploymentMaxSurge: 25%
deploymentMaxUnavailable: 25%

modelBundle:
  existingClaim: ""
  existingSecret: ""
  mountPath: /model-bundle

inference:
  enabled: true
  replicas: 1
  device: cpu
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

demoTarget:
  enabled: true
  observation:
    enabled: false
    sensorId: ""
    queueSize: 1000
    workers: 1
    retryAttempts: 3
    retryBackoffSeconds: 0.25
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

zeek:
  enabled: false
  image: zeek/zeek@sha256:c7dfad9ab8296b2994d113222e77a22ebc9c8963b2b1200b798484ac923bc94f
  interface: eth0
  captureFilter: ""
  sensorId: ""
  queueSize: 1000
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  shipperResources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}

demoConsole:
  enabled: false
  monitorBufferSize: 500
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

trafficGenerator:
  enabled: false
  agentUrl: http://10.10.0.20:8091
  sensorId: sensor-34-1
  agentTokenSecretName: ""
  agentTokenSecretKey: token
  observationTokenSecretName: ""
  observationTokenSecretKey: token

gateway:
  enabled: false
  image: nginxinc/nginx-unprivileged:1.29.1-alpine
  service:
    type: LoadBalancer
    loadBalancerIP: ""
    annotations:
      networking.gke.io/load-balancer-type: Internal
      networking.gke.io/internal-load-balancer-allow-global-access: "true"
  observationPort:
    enabled: false
    port: 8082
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

collector:
  enabled: false
  replicas: 1
  monitorBufferSize: 500
  window:
    durationSeconds: null
    maxFlows: null
    emitStrideFlows: null
    allowedLatenessSeconds: null
  alertPolicy:
    enabled: false
    decisionSource: fusion
    confidenceThreshold: null
    confidenceBoundaries: null
    entropyBoundaries: null
    classSeverity: null
    entityHashSecretName: ""
    entityHashSecretKey: entity-hash-key
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

alertRouter:
  enabled: true
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

ingress:
  enabled: false
  className: nginx
  host: fedkube-detection.local

networkPolicy:
  enabled: true

elasticsearch:
  enabled: false
  endpoint: ""
  index: fedper-detections
  username: elastic
  credentialsSecretName: ""
  credentialsSecretKey: elastic
  caSecretName: ""
  egressCIDR: ""

elasticStack:
  enabled: false
  name: fedper-detection
  version: 9.2.3
  kibanaCount: 1
  kibanaNodeOptions: --max-old-space-size=512
  bootstrapRevision: v1
  storageClassName: standard-rwo
  storageSize: 10Gi
  retentionDays: 7
  elasticsearchResources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {cpu: "1", memory: 2Gi}
  kibanaResources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: 500m, memory: 1Gi}

serviceAccount:
  create: true
  name: ""

externalSecrets:
  enabled: false
  clusterSecretStore: gcp-secret-manager
  entityHashSecretId: fedkube-detection-entity-hash
  trafficAgentSecretId: fedkube-traffic-agent-token
  trafficObservationSecretId: fedkube-traffic-observation-token

evaluation:
  enabled: false
  mode: window-validation
  artifactsClaim:
    create: true
    retain: false
    name: fedper-window-evaluation
    storageClassName: standard-rwo
    size: 1Gi
  sourceContractPath: /app/configs/application/iot23-replay-sources.json
  replayPath: /artifacts/replay/exact-gke-r0030
  reportPath: /artifacts/evaluation/window-validation.json
  windowReportPath: /artifacts/evaluation/window-validation.json
  candidateConfigPath: /app/configs/application/window-candidates.yaml
  activeDeadlineSeconds: 86400
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
      ephemeral-storage: 14Gi
    limits:
      cpu: "3"
      memory: 4Gi
      ephemeral-storage: 18Gi
