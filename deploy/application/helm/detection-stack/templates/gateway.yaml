{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "detection-stack.fullname" . }}-gateway
data:
  default.conf: |
    server {
      listen 8080;
      server_tokens off;
      client_max_body_size 1m;

      location /target/ {
        proxy_pass http://{{ include "detection-stack.fullname" . }}-target/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://{{ include "detection-stack.fullname" . }}-console:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
    {{- if .Values.gateway.observationPort.enabled }}
    server {
      listen {{ .Values.gateway.observationPort.port }};
      server_tokens off;
      client_max_body_size 64k;

      location = /observe {
        proxy_pass http://{{ include "detection-stack.fullname" . }}-collector:8082/observe;
        proxy_set_header X-FedKube-Observation-Token $http_x_fedkube_observation_token;
        proxy_set_header Content-Type application/json;
      }

      location / {
        return 404;
      }
    }
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "detection-stack.fullname" . }}-gateway
  labels: {fedkube.io/release-id: {{ .Values.releaseId | quote }}}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.deploymentStrategy }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentMaxSurge }}
      maxUnavailable: {{ .Values.deploymentMaxUnavailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: detection-gateway}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detection-gateway
        fedkube.io/release-id: {{ .Values.releaseId | quote }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.gateway.image | quote }}
          ports:
            - {name: http, containerPort: 8080}
            {{- if .Values.gateway.observationPort.enabled }}
            - {name: observation, containerPort: {{ .Values.gateway.observationPort.port }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
        {{- if and .Values.trafficGenerator.enabled .Values.trafficGenerator.emulator.enabled }}
        - name: protocol-emulator
          image: {{ include "detection-stack.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, src.application.demo_target.protocol_emulator]
          args:
            - --ssh-port={{ .Values.trafficGenerator.emulator.sshContainerPort }}
            - --irc-port={{ .Values.trafficGenerator.emulator.ircContainerPort }}
          ports:
            - {name: ssh-emulator, containerPort: {{ .Values.trafficGenerator.emulator.sshContainerPort }}}
            - {name: irc-emulator, containerPort: {{ .Values.trafficGenerator.emulator.ircContainerPort }}}
          readinessProbe:
            tcpSocket: {port: ssh-emulator}
          resources: {{- toYaml .Values.trafficGenerator.emulator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 49999
            capabilities: {drop: [ALL]}
        {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "detection-stack.fullname" . }}-gateway}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: cache
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "detection-stack.fullname" . }}-gateway
  annotations:
    {{- toYaml .Values.gateway.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  {{- with .Values.gateway.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector: {app.kubernetes.io/name: detection-gateway}
  ports:
    - {name: http, port: 80, targetPort: http}
    {{- if and .Values.trafficGenerator.enabled .Values.trafficGenerator.emulator.enabled }}
    - {name: ssh-emulator, port: 22, targetPort: ssh-emulator}
    - {name: irc-emulator, port: 6667, targetPort: irc-emulator}
    {{- end }}
    {{- if .Values.gateway.observationPort.enabled }}
    - {name: observation, port: {{ .Values.gateway.observationPort.port }}, targetPort: observation}
    {{- end }}
{{- end }}
