{{- if .Values.demoTarget.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "detection-stack.fullname" . }}-target
  labels: {fedkube.io/release-id: {{ .Values.releaseId | quote }}}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.deploymentStrategy }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentMaxSurge }}
      maxUnavailable: {{ .Values.deploymentMaxUnavailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: demo-target}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-target
        fedkube.io/release-id: {{ .Values.releaseId | quote }}
    spec:
      serviceAccountName: {{ include "detection-stack.serviceAccountName" . }}
      containers:
        - name: target
          image: {{ include "detection-stack.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["src.application.demo_target.app:app", "--host", "0.0.0.0", "--port", "8080"]
          {{- if and .Values.demoTarget.observation.enabled (not .Values.zeek.enabled) }}
          env:
            - name: COLLECTOR_OBSERVE_URL
              value: http://{{ include "detection-stack.fullname" . }}-collector:8082/observe
            - name: DEMO_SENSOR_ID
              value: {{ .Values.demoTarget.observation.sensorId | quote }}
            - name: DEMO_TARGET_ENTITY
              value: demo-target
            - name: DEMO_TARGET_PORT
              value: "8080"
            - name: OBSERVATION_QUEUE_SIZE
              value: {{ .Values.demoTarget.observation.queueSize | quote }}
            - name: OBSERVATION_WORKERS
              value: {{ .Values.demoTarget.observation.workers | quote }}
            - name: OBSERVATION_RETRY_ATTEMPTS
              value: {{ .Values.demoTarget.observation.retryAttempts | quote }}
            - name: OBSERVATION_RETRY_BACKOFF_SECONDS
              value: {{ .Values.demoTarget.observation.retryBackoffSeconds | quote }}
          {{- end }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: http}
          resources: {{- toYaml .Values.demoTarget.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 49999
            capabilities: {drop: [ALL]}
        {{- if .Values.zeek.enabled }}
        - name: zeek
          image: {{ .Values.zeek.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [bash, -euc]
          args:
            - |
              cd /zeek-logs
              # Pod veth checksum offload exposes pre-offload checksums to
              # packet capture; -C is required for correct conn_state/history.
              args=(-C -i "${ZEEK_INTERFACE}")
              if [[ -n "${ZEEK_CAPTURE_FILTER}" ]]; then
                args+=(-f "${ZEEK_CAPTURE_FILTER}")
              fi
              exec zeek "${args[@]}" LogAscii::use_json=T local
          env:
            - {name: ZEEK_INTERFACE, value: {{ .Values.zeek.interface | quote }}}
            - {name: ZEEK_CAPTURE_FILTER, value: {{ .Values.zeek.captureFilter | quote }}}
          resources: {{- toYaml .Values.zeek.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile: {type: RuntimeDefault}
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
          volumeMounts:
            - {name: zeek-logs, mountPath: /zeek-logs}
            - {name: zeek-tmp, mountPath: /tmp}
        - name: zeek-shipper
          image: {{ include "detection-stack.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, src.application.collection.zeek_shipper]
          args:
            - --path=/zeek-logs/conn.log
            - --collector-url=http://{{ include "detection-stack.fullname" . }}-collector:8082/observe
            - --sensor-id={{ .Values.zeek.sensorId }}
            - --queue-size={{ .Values.zeek.queueSize }}
          resources: {{- toYaml .Values.zeek.shipperResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 49999
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: zeek-logs, mountPath: /zeek-logs, readOnly: true}
            - {name: zeek-tmp, mountPath: /tmp}
        {{- end }}
      {{- if .Values.zeek.enabled }}
      volumes:
        - name: zeek-logs
          emptyDir: {sizeLimit: 128Mi}
        - name: zeek-tmp
          emptyDir: {sizeLimit: 64Mi}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "detection-stack.fullname" . }}-target
spec:
  selector: {app.kubernetes.io/name: demo-target}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: probe-0, port: 8080, targetPort: http}
    - {name: probe-1, port: 8081, targetPort: http}
    - {name: probe-2, port: 8082, targetPort: http}
    - {name: probe-3, port: 8083, targetPort: http}
    - {name: probe-4, port: 8084, targetPort: http}
    - {name: probe-5, port: 8085, targetPort: http}
{{- end }}
