{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "detection-stack.fullname" . }}-entity-hash
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ include "detection-stack.fullname" . }}-entity-hash
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: entity-hash-key
      remoteRef:
        key: {{ .Values.externalSecrets.entityHashSecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
