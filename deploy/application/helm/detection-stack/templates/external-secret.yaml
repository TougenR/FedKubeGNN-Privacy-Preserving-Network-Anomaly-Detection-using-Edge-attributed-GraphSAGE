{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "detection-stack.fullname" . }}-entity-hash
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ include "detection-stack.fullname" . }}-entity-hash
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: entity-hash-key
      remoteRef:
        key: {{ .Values.externalSecrets.entityHashSecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
{{- if and .Values.externalSecrets.enabled .Values.trafficGenerator.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "detection-stack.fullname" . }}-traffic-agent-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ .Values.trafficGenerator.agentTokenSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.trafficGenerator.agentTokenSecretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.trafficAgentSecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "detection-stack.fullname" . }}-traffic-observation-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: {{ .Values.trafficGenerator.observationTokenSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.trafficGenerator.observationTokenSecretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.trafficObservationSecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
