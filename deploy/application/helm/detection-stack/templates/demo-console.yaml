{{- if .Values.demoConsole.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "detection-stack.fullname" . }}-console
  labels: {fedkube.io/release-id: {{ .Values.releaseId | quote }}}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.deploymentStrategy }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentMaxSurge }}
      maxUnavailable: {{ .Values.deploymentMaxUnavailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: demo-console}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-console
        fedkube.io/release-id: {{ .Values.releaseId | quote }}
    spec:
      serviceAccountName: {{ include "detection-stack.serviceAccountName" . }}
      containers:
        - name: console
          image: {{ include "detection-stack.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["src.application.demo_console.app:app", "--host", "0.0.0.0", "--port", "8090"]
          env:
            - name: DEMO_SCENARIO_CONFIG
              value: /app/configs/application/demo-scenarios.yaml
            - name: COLLECTOR_URL
              value: http://{{ include "detection-stack.fullname" . }}-collector:8082
            - name: OBSERVATION_MODE
              value: {{ ternary "zeek" "ingress-adapter" .Values.zeek.enabled | quote }}
            - name: INFERENCE_URL
              value: http://{{ include "detection-stack.fullname" . }}-inference:8000/predict
            - name: SCIENTIFIC_REPLAY_CONFIG
              value: /app/configs/application/scientific-replay.json
            - name: FUSION_POLICY_PATH
              value: /app/configs/application/multi-head-fusion-policy.json
            - name: DEMO_TARGET_URL
              value: http://{{ include "detection-stack.fullname" . }}-gateway/target
            - name: DEMO_TARGET_STATUS_URL
              value: http://{{ include "detection-stack.fullname" . }}-target:8080
            - name: DEMO_SCAN_URLS
              value: {{ list
                (printf "http://%s-target:8080" (include "detection-stack.fullname" .))
                (printf "http://%s-target:8081" (include "detection-stack.fullname" .))
                (printf "http://%s-target:8082" (include "detection-stack.fullname" .))
                (printf "http://%s-target:8083" (include "detection-stack.fullname" .))
                (printf "http://%s-target:8084" (include "detection-stack.fullname" .))
                (printf "http://%s-target:8085" (include "detection-stack.fullname" .)) | toJson | quote }}
            {{- if .Values.trafficGenerator.enabled }}
            - name: TRAFFIC_AGENT_URL
              value: {{ .Values.trafficGenerator.agentUrl | quote }}
            - name: TRAFFIC_SENSOR_ID
              value: {{ .Values.trafficGenerator.sensorId | quote }}
            - name: TRAFFIC_AGENT_TOKEN_FILE
              value: /var/run/fedkube/traffic-agent/token
            {{- end }}
          ports: [{name: http, containerPort: 8090}]
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
          resources: {{- toYaml .Values.demoConsole.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 49999
            capabilities: {drop: [ALL]}
          {{- if .Values.trafficGenerator.enabled }}
          volumeMounts:
            - {name: traffic-agent-token, mountPath: /var/run/fedkube/traffic-agent, readOnly: true}
          {{- end }}
      {{- if .Values.trafficGenerator.enabled }}
      volumes:
        - name: traffic-agent-token
          secret:
            secretName: {{ .Values.trafficGenerator.agentTokenSecretName }}
            items:
              - {key: {{ .Values.trafficGenerator.agentTokenSecretKey }}, path: token}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "detection-stack.fullname" . }}-console
spec:
  selector: {app.kubernetes.io/name: demo-console}
  ports: [{name: http, port: 8090, targetPort: http}]
{{- end }}
