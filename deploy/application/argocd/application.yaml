apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fedkube-detection
  namespace: argocd
  annotations:
    fedkube.io/deployment-gate: gcp-approved-2026-08-06
spec:
  project: fedkube
  source:
    repoURL: https://github.com/TougenR/FedKubeGNN-Privacy-Preserving-Network-Anomaly-Detection-using-Edge-attributed-GraphSAGE.git
    targetRevision: main
    path: deploy/application/helm/detection-stack
    helm:
      releaseName: fedkube-detection
      valueFiles:
        - ../../environments/gke/values.yaml
  destination:
    name: in-cluster
    namespace: fedkube-detection
  # Deliberately no automated sync. Each scientific/live transition is reviewed
  # and synchronized explicitly even after the GCP approval.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
