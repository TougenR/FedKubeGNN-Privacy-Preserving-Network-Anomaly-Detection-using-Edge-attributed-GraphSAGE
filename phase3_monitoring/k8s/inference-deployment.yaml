apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedkube-inference
  namespace: fedkube-ids
  labels:
    app: fedkube-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fedkube-inference
  template:
    metadata:
      labels:
        app: fedkube-inference
    spec:
      containers:
      - name: inference-service
        image: fedkube-inference:latest
        imagePullPolicy: Never
        env:
        - name: INFERENCE_DEVICE
          value: "cpu"
        - name: MODEL_VERSION
          value: "phase1-pooled-egraphsage"
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "1000m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
