[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedkube-gnn-phase2"
version = "0.1.0"
description = "Reusable federated learning boundary for IoT-23 E-GraphSAGE"
requires-python = ">=3.10"
dependencies = [
  "flwr[simulation]==1.32.1",
  "numpy>=1.26,<2.0",
  "torch>=2.1.0",
]

[project.optional-dependencies]
phase1 = [
  "torch-geometric>=2.5.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7.0",
  "pyarrow>=15.0.0",
]
phase3 = [
  "fastapi>=0.110.0",
  "pydantic>=2.7.0",
  "uvicorn>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flwr.app]
publisher = "fedkube-m06"
fab-format-version = 0
flwr-version-target = "1.32.1"

[tool.flwr.app.components]
serverapp = "src.federated.flower.unified_server_app:app"
clientapp = "src.federated.flower.unified_client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.15
weight-decay = 0.0
grad-clip = 1.0
optimizer = "sgd"
strategy = "fedavg"
proximal-mu = 0.0
seed = 42
save-model = false
model-output = "artifacts/phase2/toy_final_model.pt"
task = "toy"
phase2-config = "configs/phase2/iot23-federated.yaml"
dataset-root = "artifacts/phase2/prepared/current"
evaluate-split = "val"
final-split = "test"
events-output = "artifacts/phase2/flower-events"
flower-output-root = "artifacts/phase2/flower-runs"
