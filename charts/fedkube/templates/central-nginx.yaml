{{- if eq .Values.mode "central" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fedkube.fullname" . }}-nginx
  labels:
    {{- include "fedkube.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr info;
    events { worker_connections 1024; }
    stream {
      upstream superlink_fleet {
        server {{ include "fedkube.fullname" . }}-superlink:9092;
      }
      server {
        listen 8443;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
        proxy_pass superlink_fleet;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fedkube.fullname" . }}-nginx
  labels:
    {{- include "fedkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fedkube.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: internal-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fedkube.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: internal-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.3-alpine
          ports: [{name: tls, containerPort: 8443}]
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: {{ include "fedkube.fullname" . }}-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fedkube.fullname" . }}-nginx
  labels:
    {{- include "fedkube.labels" . | nindent 4 }}
  annotations:
    networking.gke.io/load-balancer-type: Internal
    networking.gke.io/internal-load-balancer-allow-global-access: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.flower.internalLoadBalancerIP }}
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: {{ include "fedkube.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: internal-nginx
  ports:
    - {name: flower-tls, port: 443, targetPort: 8443, protocol: TCP}
{{- end }}
