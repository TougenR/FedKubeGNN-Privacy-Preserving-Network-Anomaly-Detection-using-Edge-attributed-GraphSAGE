{{- if eq .Values.mode "edge" }}
{{- $root := . }}
{{- range .Values.flower.clients }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fedkube.fullname" $root }}-head-{{ .id | lower }}
  labels:
    {{- include "fedkube.labels" $root | nindent 4 }}
    app.kubernetes.io/component: personalized-head
    fedkube.io/client-id: {{ .id | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $root.Values.flower.personalizedStateSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fedkube.fullname" $root }}-client-{{ .id | lower }}
  labels:
    {{- include "fedkube.labels" $root | nindent 4 }}
    app.kubernetes.io/component: flower-client
    fedkube.io/client-id: {{ .id | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fedkube.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      fedkube.io/client-id: {{ .id | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fedkube.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: flower-client
        fedkube.io/client-id: {{ .id | quote }}
        fedkube.io/scenario: {{ .malware | lower | replace "." "-" | quote }}
    spec:
      serviceAccountName: {{ include "fedkube.serviceAccountName" $root }}
      securityContext: {fsGroup: 49999}
      containers:
        - name: supernode
          image: flwr/supernode:{{ $root.Values.flower.version }}
          args:
            - --superlink={{ $root.Values.flower.superlinkAddress }}
            - --root-certificates=/tls/ca.crt
            - --clientappio-api-address=0.0.0.0:9094
            - --isolation=process
            - --node-config=client-id='{{ .id }}' partition-id={{ .partitionId }} num-partitions={{ len $root.Values.flower.clients }}
          ports: [{name: clientappio, containerPort: 9094}]
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
          resources: {{- toYaml $root.Values.resources.supernode | nindent 12 }}
        - name: clientapp
          image: {{ include "fedkube.appImage" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - --insecure
            - --plugin-type=clientapp
            - --appio-api-address=127.0.0.1:9094
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          volumeMounts:
            - {name: dataset, mountPath: /dataset, readOnly: true}
            - {name: client-events, mountPath: /artifacts}
            - {name: personalized-head, mountPath: /personalized-head}
          resources: {{- toYaml $root.Values.resources.clientApp | nindent 12 }}
      volumes:
        - name: tls
          secret: {secretName: {{ $root.Values.flower.caSecretName }}}
        - name: dataset
          persistentVolumeClaim: {claimName: {{ include "fedkube.fullname" $root }}-dataset}
        - name: client-events
          emptyDir: {}
        - name: personalized-head
          persistentVolumeClaim:
            claimName: {{ include "fedkube.fullname" $root }}-head-{{ .id | lower }}
---
{{- end }}
{{- end }}
