apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fedkube.fullname" . }}-dataset
  labels:
    {{- include "fedkube.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.dataset.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.dataset.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fedkube.fullname" . }}-dataset-sync-{{ .Values.releaseId | lower | trunc 24 }}
  labels:
    {{- include "fedkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataset-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fedkube.name" . }}
        app.kubernetes.io/component: dataset-sync
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "fedkube.serviceAccountName" . }}
      containers:
        - name: sync
          image: {{ .Values.dataset.syncImage }}
          command: [bash, -euc]
          args:
            - |
              gcloud storage rsync --recursive --delete-unmatched-destination-objects \
                "gs://{{ .Values.gcs.trainingBucket }}/{{ .Values.gcs.datasetPrefix }}" \
                /dataset
              test -f /dataset/manifest.json
          volumeMounts:
            - {name: dataset, mountPath: /dataset}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: {{ include "fedkube.fullname" . }}-dataset
