name: Terraform plan

on:
  pull_request:
    paths:
      - "deploy/federated/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_admin_source_ranges: '["${{ vars.ADMIN_CIDR }}"]'
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v4
        with: {terraform_version: 1.13.4}
      - name: Create review plan only
        run: scripts/terraform_review_plan.sh "${{ vars.ADMIN_CIDR }}"
      - uses: actions/upload-artifact@v5
        with:
          name: phase3-terraform-plan
          path: artifacts/federated/terraform/phase3-plan.txt
          retention-days: 7
