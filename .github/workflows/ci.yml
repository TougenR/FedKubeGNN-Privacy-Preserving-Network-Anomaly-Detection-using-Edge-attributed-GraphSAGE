name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/federated/environments/**"
      - "deploy/application/environments/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test tools and project boundary
        run: pip install -e ".[phase1,phase3,application]" "ruff==0.15.0"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Lint
        run: >-
          ruff check src/core src/federated src/application
          tests/core tests/federated tests/application
          scripts/update_image_digest.py tests/test_update_image_digest.py

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with: {version: v3.19.0}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.13.4}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Helm lint and render
        run: |
          helm lint deploy/federated/helm/fedkube -f deploy/federated/environments/central/values.yaml
          helm lint deploy/federated/helm/fedkube -f deploy/federated/environments/edge-01/values.yaml
          helm template fedkube-central deploy/federated/helm/fedkube -n fedkube -f deploy/federated/environments/central/values.yaml > /tmp/central.yaml
          helm template fedkube-edge-01 deploy/federated/helm/fedkube -n fedkube -f deploy/federated/environments/edge-01/values.yaml > /tmp/edge.yaml
          helm lint deploy/application/helm/detection-stack -f deploy/application/environments/local/values.yaml
          helm template fedkube-detection deploy/application/helm/detection-stack -n fedkube-detection -f deploy/application/environments/local/values.yaml > /tmp/detection.yaml
          python -m json.tool dashboards/kibana/elasticsearch-index-template.json > /dev/null
      - name: Terraform format and validate
        run: |
          terraform -chdir=deploy/federated/terraform/bootstrap fmt -check -recursive
          terraform -chdir=deploy/federated/terraform/bootstrap init -backend=false
          terraform -chdir=deploy/federated/terraform/bootstrap validate
          terraform -chdir=deploy/federated/terraform fmt -check -recursive
          terraform -chdir=deploy/federated/terraform init -backend=false
          terraform -chdir=deploy/federated/terraform validate
      - name: Ansible syntax
        run: |
          pip install ansible-core==2.19.3
          cp deploy/federated/ansible/inventory.ini.example deploy/federated/ansible/inventory.ini
          ansible-playbook -i deploy/federated/ansible/inventory.ini deploy/federated/ansible/site.yml --syntax-check

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: {sarif_file: trivy-results.sarif}
