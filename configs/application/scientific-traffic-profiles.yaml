  - id: ddos
    reference_class: DDoS
    scientific_status: candidate
    execution_enabled: true
    mechanism: ack-only
    target_group: single-blackhole
    destination_port: 80
    events: 50
    interval_ms: 4
    controls:
      events: {minimum: 10, maximum: 50}
      interval_ms: {minimum: 4, maximum: 1000}
    expected_observables:
      protocols: [tcp]
      services: [unknown]
      connection_states: [OTH]
      reference_support: 1000
      histories: [C]
      response_behaviors: [no-response]
      orig_packets: {minimum: 0, maximum: 0, unit: packets}
      resp_packets: {minimum: 0, maximum: 0, unit: packets}
      orig_bytes: {minimum: 0, maximum: 0, unit: bytes}
      resp_bytes: {minimum: 0, maximum: 0, unit: bytes}
      flow_density: {minimum: 50, maximum: 50, unit: flows/60s}
      note: >-
        Intentionally checksum-invalid ACK-only traffic reproduces TCP/80,
        OTH, history C, no response, and 50-flow density. The VM disables TX
        checksum offload so ordinary captured sessions remain checksum-valid.
