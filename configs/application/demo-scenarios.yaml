schema_version: 1
sensor_id: sensor-34-1
disclaimer: >-
  Kịch bản lưu lượng được chọn không phải là nhãn thật. Dự đoán FedPer được tạo
  độc lập; lưu lượng mô phỏng không tương đương hành vi mã độc trong IoT-23.
model_classes:
  - Benign
  - Attack
  - C&C
  - C&C-HeartBeat
  - DDoS
  - Okiru
  - PartOfAHorizontalPortScan
scenarios:
  - id: benign-browsing
    display_name: Duyệt web bình thường
    category: đường nền
    summary: Các yêu cầu HTTP cách đều, đại diện cho hoạt động duyệt web thông thường.
    mechanism: Gửi các yêu cầu GET nhỏ theo khoảng thời gian được kiểm soát.
    limitation: Đây là đường nền để đo dương tính giả, không phải một cuộc tấn công.
    defaults: {request_count: 20, interval_ms: 1000}
    bounds:
      request_count: {minimum: 5, maximum: 100, unit: yêu cầu}
      interval_ms: {minimum: 200, maximum: 5000, unit: mili giây}
  - id: connection-burst
    display_name: Bùng nổ kết nối
    category: giống tấn công
    summary: Nhiều nhóm kết nối HTTP ngắn được mở đồng thời.
    mechanism: Mở đồng thời một số lượng kết nối đã được giới hạn.
    limitation: Bùng nổ kết nối không mặc nhiên là một cuộc tấn công DDoS.
    defaults: {bursts: 3, concurrency: 20, pause_ms: 1000}
    bounds:
      bursts: {minimum: 1, maximum: 10, unit: đợt}
      concurrency: {minimum: 2, maximum: 50, unit: kết nối}
      pause_ms: {minimum: 200, maximum: 5000, unit: mili giây}
  - id: request-flood
    display_name: Dồn yêu cầu có giới hạn
    category: giống tấn công
    summary: Duy trì yêu cầu HTTP ở tốc độ cao hơn nhưng có giới hạn rõ ràng.
    mechanism: Gửi yêu cầu ở tốc độ cố định trong một khoảng thời gian ngắn.
    limitation: Kịch bản này giống DDoS nhưng không phải nhãn thật của dữ liệu.
    defaults: {requests_per_second: 20, duration_seconds: 10}
    bounds:
      requests_per_second: {minimum: 5, maximum: 50, unit: yêu cầu/giây}
      duration_seconds: {minimum: 2, maximum: 30, unit: giây}
  - id: slow-connections
    display_name: Kết nối chậm
    category: giống tấn công
    summary: Các yêu cầu đồng thời có phản hồi được cố ý làm chậm.
    mechanism: Gọi endpoint phản hồi chậm có giới hạn trên máy đích demo.
    limitation: Chỉ mô phỏng client chậm và không làm cạn kiệt socket.
    defaults: {connections: 10, delay_ms: 3000}
    bounds:
      connections: {minimum: 2, maximum: 50, unit: kết nối}
      delay_ms: {minimum: 500, maximum: 10000, unit: mili giây}
  - id: port-probe
    display_name: Thăm dò cổng cố định
    category: giống tấn công
    summary: Thăm dò một tập nhỏ các cổng được cho phép trên máy đích lab.
    mechanism: Chỉ kết nối tới các cổng dịch vụ đích được Helm chart định nghĩa.
    limitation: Không nhận IP, hostname, URL hoặc cổng tùy ý từ người dùng.
    defaults: {port_count: 6}
    bounds:
      port_count: {minimum: 1, maximum: 6, unit: cổng}
  - id: periodic-beacon
    display_name: Lưu lượng beacon định kỳ
    category: giống tấn công
    summary: Các yêu cầu nhỏ được lặp lại theo chu kỳ đều đặn.
    mechanism: Gửi tín hiệu định kỳ, lưu lượng thấp và có thể tái hiện.
    limitation: Nhịp beacon không phải bằng chứng chắc chắn của C&C hoặc HeartBeat.
    defaults: {events: 15, interval_ms: 2000}
    bounds:
      events: {minimum: 5, maximum: 60, unit: sự kiện}
      interval_ms: {minimum: 500, maximum: 10000, unit: mili giây}
